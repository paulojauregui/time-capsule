[project]
name = "time-capsule"
version = "0.2.0"
description = "Digital Time Capsule & Multi-Epoch Safari Reading Vault / Tech Discussion Digest."
authors = [
    {name = "HowDiggy", email = "jauregui.paulo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dagster (>=1.13.0,<2.0.0)",
    "dagster-webserver (>=1.13.0,<2.0.0)",
    "dagster-duckdb-pandas (>=0.29.0,<0.30.0)",
    "duckdb (>=1.1.0,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
    "pandas (>=2.2.0,<4.0.0)",
    "pyarrow (>=18.0.0,<27.0.0)",
    "pydantic (>=2.9.0,<3.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.32.0,<1.0.0)",
    "temporalio (>=1.9.0,<2.0.0)",
    "vaderSentiment (>=3.3.2,<4.0.0)",
]

[project.scripts]
time-capsule = "time_capsule.workflows:cli_main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "time_capsule", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
pytest-dotenv = ">=0.5.2"
ruff = ">=0.8.0"
mypy = ">=1.11.0"
types-requests = ">=2.32.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
